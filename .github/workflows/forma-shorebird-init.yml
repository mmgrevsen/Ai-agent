name: Forma code push setup (one time)

# Registers the app with Shorebird and commits forma/app/shorebird.yaml.
# Run once after adding the SHOREBIRD_TOKEN secret (forma/docs/UPDATES.md).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: forma/app
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the token
        run: |
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo "::error::Add the SHOREBIRD_TOKEN repository secret first (see forma/docs/UPDATES.md)."
            exit 1
          fi
          if [ -f shorebird.yaml ]; then
            echo "shorebird.yaml already exists; nothing to do."
            exit 1
          fi
      - uses: shorebirdtech/setup-shorebird@v1
      - name: Register the app
        run: shorebird init --display-name "Forma"
      - name: Commit shorebird.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorebird.yaml pubspec.yaml
          git commit -m "Enable Shorebird code push for Forma"
          git push
