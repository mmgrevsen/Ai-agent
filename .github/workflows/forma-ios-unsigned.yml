name: Forma iOS (unsigned .ipa)

# Builds an unsigned .ipa for sideloading (SideStore / Sideloadly re-sign it
# with the installer's own Apple ID) and publishes it on the
# `forma-ios-latest` release, so it has a fixed download link that works on
# the phone without a GitHub login. See forma/docs/INSTALL-IPHONE.md.
on:
  workflow_dispatch:
  push:
    branches: [claude/lucid-planck-umj6jk]
    paths:
      - 'forma/app/**'
      - '.github/workflows/forma-ios-unsigned.yml'

concurrency:
  group: forma-ios
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: forma/app
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get
      # The run number makes every build a newer version than the last.
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: Package .ipa
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Forma.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Forma-ipa
          path: forma/app/Forma.ipa
          retention-days: 30
      - name: Publish on the forma-ios-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Forma til iPhone, build ${{ github.run_number }} (commit ${GITHUB_SHA:0:7}). Installér Forma.ipa med SideStore eller Sideloadly: se forma/docs/INSTALL-IPHONE.md på branchen ${GITHUB_REF_NAME}."
          if gh release view forma-ios-latest >/dev/null 2>&1; then
            gh release upload forma-ios-latest Forma.ipa --clobber
            gh release edit forma-ios-latest --notes "$notes"
          else
            gh release create forma-ios-latest Forma.ipa --target "$GITHUB_SHA" --title "Forma til iPhone" --notes "$notes"
          fi
