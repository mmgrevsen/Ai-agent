name: Forma iOS (unsigned .ipa)

# Builds an unsigned .ipa for sideloading (Sideloadly / AltStore re-sign it
# with the installer's own Apple ID). Download it from the run's artifacts.
on:
  workflow_dispatch:
  push:
    branches: [claude/lucid-planck-umj6jk]
    paths:
      - 'forma/app/**'
      - '.github/workflows/forma-ios-unsigned.yml'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: forma/app
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package .ipa
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Forma-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Forma-unsigned-ipa
          path: forma/app/Forma-unsigned.ipa
          retention-days: 30
