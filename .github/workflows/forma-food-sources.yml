name: Forma food sources (fetch)

# Downloads the official food composition sources and stores them unchanged
# on the `forma-food-sources` release, so the converter
# (forma/app/tool/import_foods.py) can be developed and re-run reproducibly.
#   * Frida (DTU Food, Denmark): DOI 10.11583/DTU.29500682
#   * USDA FoodData Central (public domain, CC0): SR Legacy and FNDDS
#     (survey foods: dishes and meals as eaten)
on:
  workflow_dispatch:
  push:
    branches: [claude/lucid-planck-umj6jk]
    paths:
      - '.github/workflows/forma-food-sources.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: forma-food-sources
    steps:
      - name: Frida (DTU)
        continue-on-error: true
        run: |
          mkdir -p out
          echo "== DOI resolves to:"; curl -sS -o /dev/null -w "%{url_effective}\n" -L "https://doi.org/10.11583/DTU.29500682" || true
          python3 - <<'EOF'
          import json, re, urllib.request
          def get(u):
              req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 (Forma food import)'})
              return urllib.request.urlopen(req, timeout=60).read()
          article = None
          for u in ['https://api.figshare.com/v2/articles/29500682', 'https://data.dtu.dk/api/v2/articles/29500682',
                    'https://api.figshare.com/v2/articles?doi=10.11583/DTU.29500682']:
              try:
                  data = json.loads(get(u)); print('OK', u)
                  if isinstance(data, list):
                      data = json.loads(get(data[0]['url'])) if data else None
                  if data and data.get('files'):
                      article = data; break
              except Exception as e:
                  print('FAIL', u, e)
          if article is None:
              # Search by title on figshare.
              try:
                  req = urllib.request.Request('https://api.figshare.com/v2/articles/search', data=json.dumps({'search_for': 'Frida Danish Food Composition', 'page_size': 20}).encode(), headers={'Content-Type': 'application/json'})
                  hits = json.loads(urllib.request.urlopen(req, timeout=60).read())
                  for h in hits: print('HIT', h.get('id'), h.get('doi'), h.get('title'))
                  for h in hits:
                      if 'frida' in (h.get('title') or '').lower():
                          article = json.loads(get(h['url'])); break
              except Exception as e:
                  print('search failed', e)
          if article is None:
              raise SystemExit('Frida not found')
          json.dump(article, open('out/frida-article.json', 'w'), indent=1)
          print('Title:', article.get('title')); print('DOI:', article.get('doi')); print('License:', (article.get('license') or {}).get('name')); print('Version:', article.get('version'))
          for f in article.get('files', []):
              name = re.sub(r'[^A-Za-z0-9._-]', '_', f['name'])
              print('Downloading', name, f.get('size'))
              open('out/frida-' + name, 'wb').write(get(f['download_url']))
          EOF
          ls -la out
      - name: USDA FoodData Central
        run: |
          page=$(curl -sSfL https://fdc.nal.usda.gov/download-datasets)
          for kind in sr_legacy_food_csv survey_food_csv; do
            url=$(echo "$page" | grep -oE "https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_${kind}_[0-9-]+\.zip" | sort -u | tail -1)
            if [ -z "$url" ]; then
              url=$(echo "$page" | grep -oE "/fdc-datasets/FoodData_Central_${kind}_[0-9-]+\.zip" | sort -u | tail -1 | sed 's#^#https://fdc.nal.usda.gov#')
            fi
            echo "$kind -> $url"
            curl -sSfL "$url" -o "out/usda-$kind.zip"
          done
          ls -la out
      - name: Store on the release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "Forma food sources" \
              --notes "Unmodified downloads of Frida (DTU Food) and USDA FoodData Central used to build Forma's reference foods."
          fi
          gh release upload "$TAG" out/* --clobber
