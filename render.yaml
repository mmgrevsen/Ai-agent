# One-click hosting of Push Legends (game + login + friends) on Render.com:
# Render dashboard -> New -> Blueprint -> pick this repository. You get an https address to open on
# the phone (https is also what lets the phone allow the camera). The disk keeps accounts and saves.
services:
  - type: web
    name: push-legends
    runtime: docker
    dockerfilePath: ./push-legends/Dockerfile
    dockerContext: ./push-legends
    plan: starter
    healthCheckPath: /v1/health
    disk:
      name: push-legends-data
      mountPath: /data
      sizeGB: 1
