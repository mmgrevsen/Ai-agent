name: forma
description: "Forma — all-in-one training, nutrition and recovery"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  sqlite3: ^3.8.0
  path_provider: ^2.1.6
  path: ^1.9.1
  supabase_flutter: ^2.18.3
  fl_chart: ^1.3.0
  http: ^1.6.0
  uuid: ^4.6.0
  intl: ^0.20.3
  collection: ^1.19.1
  health: ^13.3.2
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.4
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter


flutter:
  uses-material-design: true

  assets:
    - assets/exercises.json

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
